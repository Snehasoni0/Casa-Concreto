<head>
  <meta charset="UTF-8" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Blog – Jodhpur Travel & Luxury Villa Stories | Casa Concreto" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Blog – Jodhpur Travel & Luxury Villa Stories | Casa Concreto" />
  <meta name="twitter:description" content="Stories, travel guides and inspiration from Casa Concreto — Jodhpur's finest private luxury villa." />
  <meta name="twitter:image" content="https://res.cloudinary.com/dx1jbyib2/image/upload/v1776245411/blogs-7_t5fzmf.webp" />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Blog",
    "name": "Casa Concreto Blog",
    "description": "Stories and insights about luxury hospitality and travel in Jodhpur.",
    "url": "https://casaconcreto.in/pages/discover/blog.html"
  }
  </script>
  <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="stylesheet" href="../../assets/css/blog.css">
  <link rel="stylesheet" href="../../assets/css/responsive.css">

</head>

<body class="blog">
  <div id="global-preloader" class="global-preloader">
    <div class="loader-logo-wrapper">
      <img loading="lazy" src="../../assets/images/Casaconcreto-blacklogo.png" class="loader-logo-bg" alt="Loading">
      <img loading="lazy" src="../../assets/images/Casaconcreto-blacklogo.png" class="loader-logo-fill" alt="Loading">
    </div>
  </div>
  <script src="../../assets/js/header.js"></script>

  <!-- Blog Page Content  -->
  <section id="hero-banner" class="page-hero blog-hero">
    <h1 data-aos="fade-up" data-aos-duration="1000">Stories & Insights</h1>
    <a href="#blog-wrapper" class="scroll-down">
      <i class="fa-solid fa-arrow-down"></i>
    </a>
  </section>

  <section data-aos="fade-in" data-aos-duration="2000" id="blog-wrapper">

    <!-- Featured -->
    <div data-aos="fade-up" data-aos-duration="1000" class="featured-blog" id="featuredBlog"></div>

    <!-- Grid -->
    <div data-aos="fade-up" data-aos-duration="1000" class="blog-grid" id="blogGrid"></div>

  </section>


  <script src="../../assets/js/footer.js"></script>
  <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
  <script src="https://unpkg.com/lenis@1.1.18/dist/lenis.min.js"></script>
  <script src="../../assets/js/main.js"></script>
  <script>
    fetch("http://localhost/casaconcreto/admin/get-blogs.php")
      .then(res => res.json())
      .then(data => {

        const featuredContainer = document.getElementById("featuredBlog");
        const gridContainer = document.getElementById("blogGrid");

        if (data.length === 0) return;

        // 🔥 FEATURED BLOG (first one)
        const featured = data[0];

        featuredContainer.innerHTML = `
      <div>
        <img src="http://localhost/casaconcreto/uploads/${featured.image}" />
      </div>

      <div class="featured-text">
        <h2>${featured.title}</h2>
        <p>${featured.content.substring(0, 150)}...</p>
        <a href="blog-des.html?id=${featured.id}">Read More</a>
      </div>
    `;

        // 🔥 GRID BLOGS (rest)
        let gridHTML = "";

        data.slice(1, 7).forEach(blog => {
          gridHTML += `
        <div class="blog-card">
          <img src="http://localhost/casaconcreto/uploads/${blog.image}" />

          <h3>${blog.title}</h3>

          <p>${blog.content.substring(0, 100)}...</p>

          <a href="blog-des.html?id=${blog.id}">
            Read More
          </a>
        </div>
      `;
        });

        gridContainer.innerHTML = gridHTML;

      })
      .catch(err => console.log(err));
  </script>

</body>

</html>
