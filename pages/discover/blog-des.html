<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Blog | Casa Concreto – Jodhpur's Luxury Villa Insights</title>
  <meta name="description" content="Explore stories and insights about luxury hospitality, architecture, and Rajasthani culture at Casa Concreto Jodhpur." />
  <meta name="keywords" content="Jodhpur travel blog, luxury villa Rajasthan, boutique stay insights" />
  <meta name="robots" content="index, follow" />
  <link rel="icon" type="image/png" href="../../assets/images/casa-concreto-logo.png">

  <meta property="og:type" content="article" />
  <meta property="og:title" content="Blog | Casa Concreto" />
  <meta property="og:description" content="Read our latest insights into luxury living and Rajasthani heritage." />
  <meta property="og:url" content="https://casaconcreto.in/pages/discover/blog-des.html" />
  <meta property="og:image" content="" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Blog | Casa Concreto" />
  <meta name="twitter:description" content="Read our latest insights into luxury living and Rajasthani heritage." />
  <meta name="twitter:image" content="" />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BlogPosting",
    "publisher": {
      "@type": "Organization",
      "name": "Casa Concreto",
      "logo": "https://casaconcreto.in/assets/images/casa-concreto-logo.png"
    }
  }
  </script>
  <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="stylesheet" href="../../assets/css/blogdetail.css">
  <link rel="stylesheet" href="../../assets/css/responsive.css">
</head>

<body class="blog">

  <div id="global-preloader" class="global-preloader">
    <div class="loader-logo-wrapper">
      <img src="../../assets/images/Casaconcreto-blacklogo.png" class="loader-logo-bg" alt="Loading">
      <img src="../../assets/images/Casaconcreto-blacklogo.png" class="loader-logo-fill" alt="Loading">
    </div>
  </div>

  <script src="../../assets/js/header.js"></script>

  <!-- BLOG DETAIL -->
  <section class="blog-preview" data-aos="fade-up" data-aos-duration="1000">

    <div class="preview-container">

      <div class="preview-card">

        <!-- HEADER -->
        <div class="blog-header">

          <h2>Loading...</h2>

          <p class="blog-intro">Loading content...</p>

          <div class="blog-meta">

            <div class="author">
              <div class="avatar"></div>
              <span>Loading author...</span>
            </div>

            <span class="pill">---</span>
            <span class="pill">---</span>
            <span class="pill">---</span>

          </div>

        </div>

        <!-- IMAGE -->
        <div class="blog-image">
          <img src="" alt="">
        </div>

        <!-- CONTENT -->
        <div class="blog-content">
          <p>Loading content...</p>
        </div>

      </div>

    </div>

  </section>

  <script src="../../assets/js/footer.js"></script>
  <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
  <script src="../../assets/js/main.js"></script>

  <!-- 🔥 DYNAMIC BLOG LOGIC -->
  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    if (!id) {
      document.querySelector(".blog-header h2").innerText = "Blog Not Found";
      throw new Error("No blog ID found in URL");
    }

    fetch(`http://localhost/casaconcreto/admin/get-blog.php?id=${id}`)
      .then(res => res.json())
      .then(blog => {

        console.log("BLOG DATA:", blog);

        // TITLE
        document.querySelector(".blog-header h2").innerText =
          blog.title || "No Title";

        // SHORT DESCRIPTION
        document.querySelector(".blog-intro").innerText =
          blog.short_desc || "";

        // AUTHOR NAME
        document.querySelector(".author span").innerText =
          blog.author_name || "Unknown Author";

        // AUTHOR IMAGE
        document.querySelector(".avatar").innerHTML =
          blog.author_image
            ? `<img src="http://localhost/casaconcreto/uploads/${blog.author_image}" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">`
            : "";

        // 🔥 READ TIME CALCULATION (FALLBACK)
        let readTimeDisplay = blog.read_time || "";
        if (!readTimeDisplay && blog.content) {
          const plainText = blog.content.replace(/<[^>]*>/g, ""); // Strip HTML for word count
          const words = plainText.trim().split(/\s+/).filter(Boolean).length;
          readTimeDisplay = `${Math.ceil(words / 200)} min read`;
        }

        // PILL DATA
        const pills = document.querySelectorAll(".pill");

        if (pills.length >= 3) {
          pills[0].innerText = blog.insights || "Insights";
          pills[1].innerText = blog.blog_date || "";
          pills[2].innerText = readTimeDisplay || "5 min read";
        }

        // BLOG IMAGE
        document.querySelector(".blog-image img").src =
          blog.image
            ? `http://localhost/casaconcreto/uploads/${blog.image}`
            : "";

        // BLOG CONTENT
        document.querySelector(".blog-content").innerHTML = blog.content || "";

        // 🔥 DYNAMIC SEO UPDATES
        const pageTitle = `${blog.title || "Blog"} | Casa Concreto`;
        const cleanContent = blog.content ? blog.content.replace(/<[^>]*>/g, "") : "";
        const pageDesc = blog.short_desc || (cleanContent ? cleanContent.substring(0, 160) : "Read our latest insights into luxury living.");
        const pageImg = blog.image ? `http://localhost/casaconcreto/uploads/${blog.image}` : "";

        console.log("Setting Dynamic SEO:", { title: pageTitle, desc: pageDesc, img: pageImg });

        document.title = pageTitle;

        // Meta Tags
        document.querySelector('meta[name="description"]')?.setAttribute("content", pageDesc);
        
        // Open Graph
        document.querySelector('meta[property="og:title"]')?.setAttribute("content", pageTitle);
        document.querySelector('meta[property="og:description"]')?.setAttribute("content", pageDesc);
        document.querySelector('meta[property="og:image"]')?.setAttribute("content", pageImg);
        document.querySelector('meta[property="og:url"]')?.setAttribute("content", window.location.href);

        // Twitter
        document.querySelector('meta[name="twitter:title"]')?.setAttribute("content", pageTitle);
        document.querySelector('meta[name="twitter:description"]')?.setAttribute("content", pageDesc);
        document.querySelector('meta[name="twitter:image"]')?.setAttribute("content", pageImg);

        // Update JSON-LD Schema
        const schemaScript = document.querySelector('script[type="application/ld+json"]');
        if (schemaScript) {
          try {
            const schemaData = JSON.parse(schemaScript.innerHTML);
            schemaData.headline = blog.title;
            schemaData.description = pageDesc;
            schemaData.image = pageImg;
            schemaData.datePublished = blog.blog_date;
            schemaData.author = {
              "@type": "Person",
              "name": blog.author_name || "Casa Concreto"
            };
            schemaScript.innerHTML = JSON.stringify(schemaData);
          } catch (e) { console.error("Schema Update Error:", e); }
        }

      })
      .catch(err => {
        console.log("Error:", err);
        document.querySelector(".blog-header h2").innerText =
          "Failed to load blog";
      });
  </script>

</body>
</html>
